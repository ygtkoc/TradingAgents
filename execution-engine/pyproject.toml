[project]
name = "execution-engine"
version = "0.1.0"
description = "Trading Signal Execution Engine — converts approved trade_decisions into trades"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "cryptography>=42.0",   # AES-GCM decryption for exchange API keys
]

[project.optional-dependencies]
ccxt = [
    "ccxt>=4.2.0",          # Real exchange adapter (Binance etc.)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/exchanges/binance.py"]   # Real exchange; tested via integration only

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"
