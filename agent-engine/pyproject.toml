[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-agent-engine"
version = "0.1.0"
description = "Multi-agent AI orchestration engine for the TradingAgents platform"
requires-python = ">=3.11"

dependencies = [
    # Supabase
    "supabase>=2.3.0",
    "postgrest>=0.16.0",
    # Pydantic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # LangGraph + LangChain
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # HTTP
    "httpx>=0.27.0",
    # Async
    "anyio>=4.3.0",
    "asyncio-throttle>=1.0.2",
    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b",
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "python-ulid>=2.2.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-pytz",
]

[project.scripts]
agent-engine = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
log_cli = true
log_cli_level = "WARNING"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
