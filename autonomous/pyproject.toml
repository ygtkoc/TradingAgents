[project]
name = "autonomous"
version = "0.1.0"
description = "Autonomous paper-trading driver — market data ingest, signal seeder, demo-bot bootstrap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "aiohttp>=3.10",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
