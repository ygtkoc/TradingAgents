[project]
name = "position-engine"
version = "0.1.0"
description = "Position & Trade Lifecycle Engine — monitors open trades, enforces SL/TP/trailing-stop, manages live close, reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "cryptography>=42.0",   # AES-GCM for exchange API key decryption
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/exchanges/binance.py"]   # Real exchange; integration tests only

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"
